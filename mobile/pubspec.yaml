name: rhm_mobile
description: RHM secure mobile chat with local voice input and output.
publish_to: none
version: 0.1.11+12

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.0
  flutter_secure_storage: ^10.1.0
  flutter_local_notifications: ^19.5.0
  # 0.10.6+ fixes AGP 9 / Flutter built-in Kotlin compatibility.
  workmanager: ^0.10.6
  crypto: ^3.0.6
  open_filex: ^5.0.0
  package_info_plus: ^8.3.1
  path_provider: ^2.1.5
  flutter_tts: ^4.2.5
  flutter_markdown_plus: ^1.0.12
  http: ^1.2.2
  uuid: ^4.5.1
  speech_to_text: ^7.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
